<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mapa do evento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1E1E}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #EFEFEF; background-image: linear-gradient(#DCDCDC 1px, transparent 1px), linear-gradient(90deg, #DCDCDC 1px, transparent 1px); background-size: 32px 32px; font-family: Outfit, sans-serif; color: #1E1E1E; overflow: hidden">

  <div style="position: absolute; left: 20px; top: 128px; width: 160px; height: 96px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 24px; background: #FFFFFF; display: flex; align-items: flex-end; padding: 10px 14px; font-size: 14px; font-weight: 700">Auditório 1</div>
  <div style="position: absolute; left: 210px; top: 128px; width: 160px; height: 96px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 24px; background: #FFFFFF; display: flex; align-items: flex-end; padding: 10px 14px; font-size: 14px; font-weight: 700">Auditório 2</div>
  <div style="position: absolute; left: 20px; top: 246px; width: 350px; height: 214px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 28px; background: #C3ECF6; padding: 10px 14px; font-size: 14px; font-weight: 700">Área de estandes</div>
  <div style="position: absolute; left: 20px; top: 480px; width: 120px; height: 84px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 24px; background: #FFFFFF; display: flex; align-items: flex-end; padding: 10px 14px; font-size: 14px; font-weight: 700">Café</div>
  <div style="position: absolute; left: 160px; top: 480px; width: 210px; height: 84px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 24px; background: #FFFFFF; display: flex; align-items: flex-end; padding: 10px 14px; font-size: 14px; font-weight: 700">Sala de workshop</div>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
    <div style="position: absolute; left: {{p.x}}; top: {{p.y}}; width: 76px; display: flex; flex-direction: column; align-items: center">
      <img src="assets/crabuntu.png" alt="{{p.alt}}" style="display: block; width: 68px; height: auto; filter: {{p.filter}}">
      <div style="width: 52px; height: 12px; margin-top: -4px; border-radius: 50%; background: {{p.shadow}}"></div>
      <span style="margin-top: 4px; padding: 2px 8px; border: 2px solid #1E1E1E; border-radius: 999px; background: {{p.tag}}; font-size: 11px; font-weight: 700; white-space: nowrap">{{p.label}}</span>
    </div>
  </sc-for>

  <div style="position: absolute; left: 230px; top: 372px; width: 76px; height: 76px; box-sizing: border-box; border: 2px dashed #1E1E1E; border-radius: 999px; display: flex; align-items: center; justify-content: center">
    <div style="width: 40px; height: 40px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #4285F4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">AS</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 52px; display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 0 #1E1E1E; font-size: 15px; font-weight: 800">
      <span style="width: 30px; height: 30px; border-radius: 999px; background: #4285F4; border: 2px solid #1E1E1E; display: flex; align-items: center; justify-content: center; font-size: 13px; box-sizing: border-box">4</span>
      Nível 4
    </span>
    <div style="display: flex; gap: 8px">
      <span style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 0 #1E1E1E; font-size: 15px; font-weight: 800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="12" r="4"></circle><circle cx="16" cy="12" r="4"></circle></svg>6
      </span>
      <span style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #FBBC04; box-shadow: 0 3px 0 #1E1E1E; font-size: 15px; font-weight: 800">120 XP</span>
    </div>
  </div>

  <a href="Missao.dc.html" style="position: absolute; left: 20px; right: 20px; top: 590px; display: flex; gap: 12px; align-items: center; padding: 14px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 24px; background: #FFFFFF; box-shadow: 0 5px 0 #1E1E1E; text-decoration: none">
    <img src="assets/crabuntu.png" alt="Skin do Patrocinador C" style="flex-shrink: 0; width: 72px; height: auto; display: block; filter: hue-rotate(40deg)">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 600; color: #3A3A3A">Por perto · 40 m · Estande 3</span>
      <span style="font-size: 18px; font-weight: 800; line-height: 1.15">Caranguejo [Patrocinador C]</span>
      <span style="font-size: 14px">Desafio ao vivo · Ouro +50 XP</span>
    </div>
    <svg width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="#1E1E1E" stroke-width="1.8" aria-hidden="true"><path d="M1 8h25"></path><path d="M19 1c0 4 3 7 7 7-4 0-7 3-7 7"></path></svg>
  </a>

  <nav style="position: absolute; left: 20px; right: 20px; bottom: 22px; display: flex; gap: 6px; padding: 6px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 24px; background: #FFFFFF; box-shadow: 0 4px 0 #1E1E1E">
    <a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 2px solid #1E1E1E; border-radius: 16px; background: #C3ECF6; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Mapa</a>
    <a href="Missao.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 2px solid transparent; border-radius: 16px; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="5" r="2.5"></circle><circle cx="17" cy="12" r="2.5"></circle><circle cx="7" cy="19" r="2.5"></circle><path d="M9 6.5l6 4M15 13.5l-6 4"></path></svg>Trilha</a>
    <a href="Perfil.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 2px solid transparent; border-radius: 16px; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Dex</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pins: [
        { x: '296px', y: '112px', filter: 'hue-rotate(210deg)', shadow: 'rgba(30,30,30,0.25)', tag: '#4285F4', label: 'Missão ativa', alt: 'Caranguejo do Patrocinador A perto do Auditório 2' },
        { x: '40px', y: '290px', filter: 'hue-rotate(130deg)', shadow: 'rgba(30,30,30,0.25)', tag: '#34A853', label: 'Capturado', alt: 'Caranguejo do Patrocinador B, já capturado' },
        { x: '160px', y: '268px', filter: 'hue-rotate(40deg)', shadow: 'rgba(30,30,30,0.25)', tag: '#FBBC04', label: 'Estande 3', alt: 'Caranguejo do Patrocinador C no Estande 3' },
        { x: '280px', y: '290px', filter: 'brightness(0) opacity(0.35)', shadow: 'rgba(30,30,30,0.15)', tag: '#FFFFFF', label: '???', alt: 'Caranguejo desconhecido, ainda não descoberto' }
      ]
    };
  }
}
</script>
</body>
</html>
