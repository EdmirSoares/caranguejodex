<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caranguejodex</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1E1E}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEF; font-family: Outfit, sans-serif; color: #1E1E1E; padding: 52px 20px 22px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Caranguejodex</h1>
    <span style="padding: 6px 14px; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 0 #1E1E1E; font-size: 15px; font-weight: 800">3/6</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid #1E1E1E; border-radius: 20px; background: #FFFFFF; box-shadow: 0 4px 0 #1E1E1E">
    <div style="flex-shrink: 0; width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #4285F4; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">AS</div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 800">Ana · Nível 4</span><span>320/500 XP</span></div>
      <div style="height: 14px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #EFEFEF; overflow: hidden"><div style="width: 64%; height: 100%; background: #FBBC04; border-right: 2px solid #1E1E1E"></div></div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{crabs}}" as="c" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 12px; box-sizing: border-box; border: 2px {{c.borderStyle}} {{c.stroke}}; border-radius: 20px; background: {{c.bg}}; box-shadow: {{c.shadow}}; text-align: center">
        <span style="align-self: flex-start; font-size: 12px; font-weight: 800; color: {{c.numColor}}">{{c.num}}</span>
        <img src="assets/crabuntu.png" alt="{{c.alt}}" style="width: 84px; height: auto; display: block; filter: {{c.filter}}">
        <span style="font-size: 14px; font-weight: 800; line-height: 1.1">{{c.name}}</span>
        <span style="font-size: 12px; color: #555555">{{c.hint}}</span>
      </div>
    </sc-for>
  </div>
  <a href="Certificado.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border: 2px solid #1E1E1E; border-radius: 20px; background: #FBBC04; box-shadow: 0 5px 0 #1E1E1E; font-size: 17px; font-weight: 800; text-decoration: none">
    Certificado liberado
    <svg width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="#1E1E1E" stroke-width="1.8" aria-hidden="true"><path d="M1 8h25"></path><path d="M19 1c0 4 3 7 7 7-4 0-7 3-7 7"></path></svg>
  </a>
  <div style="flex-grow: 1"></div>
  <nav style="display: flex; gap: 6px; padding: 6px; border: 2px solid #1E1E1E; border-radius: 24px; background: #FFFFFF; box-shadow: 0 4px 0 #1E1E1E">
    <a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 2px solid transparent; border-radius: 16px; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Mapa</a>
    <a href="Missao.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 2px solid transparent; border-radius: 16px; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="5" r="2.5"></circle><circle cx="17" cy="12" r="2.5"></circle><circle cx="7" cy="19" r="2.5"></circle><path d="M9 6.5l6 4M15 13.5l-6 4"></path></svg>Trilha</a>
    <a href="Perfil.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 2px solid #1E1E1E; border-radius: 16px; background: #C3ECF6; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Dex</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const crab = (num, name, hue, bg, caught, hint) => ({
      num,
      name: caught ? name : '???',
      hint,
      bg: caught ? bg : '#E2E2E2',
      stroke: caught ? '#1E1E1E' : '#8A8A8A',
      borderStyle: caught ? 'solid' : 'dashed',
      shadow: caught ? '0 4px 0 #1E1E1E' : 'none',
      numColor: caught ? '#1E1E1E' : '#6B6B6B',
      filter: caught ? 'hue-rotate(' + hue + 'deg)' : 'brightness(0) opacity(0.25)',
      alt: caught ? 'Caranguejo ' + name + ', capturado' : 'Caranguejo ainda não capturado'
    });
    return {
      crabs: [
        crab('#001', 'Organização', 0, '#FFFFFF', true, 'Palestra de IA'),
        crab('#002', '[Patrocinador B]', 130, '#FFFFFF', true, 'Estande 2'),
        crab('#003', '[Patrocinador A]', 210, '#FFFFFF', true, 'Conexões'),
        crab('#004', '[Patrocinador C]', 40, '#FFFFFF', false, 'Estande 3'),
        crab('#005', '[Patrocinador D]', 270, '#FFFFFF', false, 'Codelab'),
        crab('#006', 'Lendário', 180, '#FFFFFF', false, 'Complete a Dex')
      ]
    };
  }
}
</script>
</body>
</html>
