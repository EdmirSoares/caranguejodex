<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Captura da conexão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1E1E}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEF; font-family: Outfit, sans-serif; color: #1E1E1E; padding: 52px 24px 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="Missao.dc.html" aria-label="Fechar e voltar à trilha" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex-grow: 1; height: 16px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; overflow: hidden"><div style="width: {{barPct}}; height: 100%; background: #4285F4; border-right: 2px solid #1E1E1E"></div></div>
  </div>

  <sc-if value="{{scanning}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Capture o QR do Bruno</h1>
      <div style="position: relative; height: 400px; border: 2px solid #1E1E1E; border-radius: 32px; background: #2A2A2A; display: flex; align-items: center; justify-content: center">
        <div style="position: relative; width: 210px; height: 210px">
          <div style="position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-left: 5px solid #FFFFFF; border-top: 5px solid #FFFFFF; border-top-left-radius: 18px"></div>
          <div style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; border-right: 5px solid #FFFFFF; border-top: 5px solid #FFFFFF; border-top-right-radius: 18px"></div>
          <div style="position: absolute; left: 0; bottom: 0; width: 44px; height: 44px; border-left: 5px solid #FFFFFF; border-bottom: 5px solid #FFFFFF; border-bottom-left-radius: 18px"></div>
          <div style="position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; border-right: 5px solid #FFFFFF; border-bottom: 5px solid #FFFFFF; border-bottom-right-radius: 18px"></div>
          <div style="position: absolute; left: 20px; right: 20px; top: 100px; height: 4px; border-radius: 999px; background: #34A853"></div>
        </div>
        <span style="position: absolute; bottom: 18px; padding: 6px 14px; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 700">Bruno Lima · Firebase · Cloud</span>
      </div>
      <div style="flex-grow: 1"></div>
      <button type="button" onClick="{{advance}}" style="height: 58px; border: 2px solid #1E1E1E; border-radius: 18px; background: #34A853; box-shadow: 0 5px 0 #1E1E1E; color: #1E1E1E; font-size: 18px; font-weight: 800; letter-spacing: 0.06em; font-family: Outfit, sans-serif">ESCANEAR</button>
    </div>
  </sc-if>

  <sc-if value="{{waiting}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 16px; flex-grow: 1; align-items: center">
      <h1 style="margin: 0; align-self: stretch; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Agora o Bruno escaneia você</h1>
      <div style="width: 260px; height: 260px; box-sizing: border-box; padding: 20px; border: 2px solid #1E1E1E; border-radius: 32px; background: #FFFFFF; box-shadow: 0 6px 0 #1E1E1E; display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px" role="img" aria-label="Seu QR pessoal">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="169">
          <div style="aspect-ratio: 1; border-radius: 2px; background: {{c.fill}}"></div>
        </sc-for>
      </div>
      <span style="padding: 6px 16px; border: 2px solid #1E1E1E; border-radius: 999px; background: #FBBC04; font-size: 15px; font-weight: 800">Seu QR expira em 0:42</span>
      <div style="flex-grow: 1"></div>
      <button type="button" onClick="{{advance}}" style="align-self: stretch; height: 58px; border: 2px solid #1E1E1E; border-radius: 18px; background: #FFFFFF; box-shadow: 0 5px 0 #1E1E1E; color: #1E1E1E; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; font-family: Outfit, sans-serif">SIMULAR: BRUNO ESCANEOU</button>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; flex-grow: 1; margin: 0 -24px -28px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 24px; text-align: center">
        <img src="assets/crabuntu.png" alt="Caranguejo do Patrocinador A, quase capturado" style="width: 220px; height: auto; display: block; filter: hue-rotate(210deg) saturate(0.6) opacity(0.75)">
        <span style="font-size: 20px; font-weight: 800">Falta 1 conexão para capturar o caranguejo [Patrocinador A]</span>
        <div style="width: 100%; height: 18px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; overflow: hidden"><div style="width: 66%; height: 100%; background: #4285F4; border-right: 2px solid #1E1E1E"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 24px 28px; border-top: 2px solid #1E1E1E; background: #34A853">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          </span>
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 21px; font-weight: 800">Conexão feita com Bruno!</span>
            <span style="font-size: 15px; font-weight: 600">+30 XP · Firebase, Cloud, Go</span>
          </div>
        </div>
        <a href="Consentimento.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 18px; background: #FFFFFF; box-shadow: 0 5px 0 #1E1E1E; font-size: 18px; font-weight: 800; letter-spacing: 0.06em; text-decoration: none">CONTINUAR</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  renderVals() {
    const step = this.state.step;
    const cells = [];
    for (let r = 0; r < 13; r++) {
      for (let c = 0; c < 13; c++) {
        const inFinder = (r < 4 && c < 4) || (r < 4 && c > 8) || (r > 8 && c < 4);
        let on;
        if (inFinder) {
          const rr = r > 8 ? r - 9 : r;
          const cc = c > 8 ? c - 9 : c;
          on = rr === 0 || rr === 3 || cc === 0 || cc === 3 || (rr > 0 && rr < 3 && cc > 0 && cc < 3);
        } else {
          on = ((r * 7 + c * 11 + r * c) % 5) < 2;
        }
        cells.push({ fill: on ? '#1E1E1E' : '#FFFFFF' });
      }
    }
    return {
      cells,
      scanning: step === 0,
      waiting: step === 1,
      done: step === 2,
      barPct: step === 0 ? '20%' : step === 1 ? '60%' : '100%',
      advance: () => this.setState({ step: Math.min(step + 1, 2) })
    };
  }
}
</script>
</body>
</html>
