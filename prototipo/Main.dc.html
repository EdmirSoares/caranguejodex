<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Onboarding com o Crabuntu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1E1E}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEF; font-family: Outfit, sans-serif; color: #1E1E1E; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <span style="font-size: 15px; font-weight: 700">DevFest Aracaju</span>
    <div style="flex-grow: 1; height: 16px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 999px; background: #FFFFFF; overflow: hidden"><div style="width: 66%; height: 100%; background: #34A853; border-right: 2px solid #1E1E1E"></div></div>
  </div>
  <div style="display: flex; align-items: flex-end; gap: 8px">
    <img src="assets/crabuntu.png" alt="Crabuntu, o caranguejo mascote" style="flex-shrink: 0; width: 140px; height: auto; display: block">
    <div style="position: relative; margin-bottom: 40px; padding: 14px 16px; border: 2px solid #1E1E1E; border-radius: 20px; background: #FFFFFF; font-size: 16px; line-height: 1.35">
      Oi, eu sou o Crabuntu! Tem uma versão minha escondida em cada estande. Bora capturar todas?
    </div>
  </div>
  <h1 style="margin: 0; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Do que você curte?</h1>
  <p style="margin: -10px 0 0; font-size: 16px; color: #3A3A3A">Escolha até 5. Isso vira suas tags.</p>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="6">
      <button type="button" onClick="{{o.toggle}}" style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 14px; border: 2px solid #1E1E1E; border-radius: 18px; background: {{o.bg}}; box-shadow: 0 4px 0 #1E1E1E; font-size: 17px; font-weight: 700; font-family: Outfit, sans-serif; color: #1E1E1E; text-align: left">
        <span style="width: 18px; height: 18px; flex-shrink: 0; border: 2px solid #1E1E1E; border-radius: 999px; background: {{o.dot}}"></span>
        {{o.label}}
      </button>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 18px; background: #34A853; box-shadow: 0 5px 0 #1E1E1E; color: #1E1E1E; font-size: 18px; font-weight: 800; letter-spacing: 0.06em; text-decoration: none">CONTINUAR</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { flutter: true, ia: true } };
  }
  renderVals() {
    const picked = this.state.picked;
    const defs = [
      { id: 'flutter', label: 'Flutter', dot: '#4285F4' },
      { id: 'ia', label: 'IA', dot: '#34A853' },
      { id: 'android', label: 'Android', dot: '#34A853' },
      { id: 'firebase', label: 'Firebase', dot: '#FBBC04' },
      { id: 'cloud', label: 'Cloud', dot: '#4285F4' },
      { id: 'web', label: 'Web', dot: '#EA4335' }
    ];
    return {
      options: defs.map((d) => ({
        ...d,
        bg: picked[d.id] ? '#C3ECF6' : '#FFFFFF',
        toggle: () => this.setState({ picked: { ...picked, [d.id]: !picked[d.id] } })
      }))
    };
  }
}
</script>
</body>
</html>
