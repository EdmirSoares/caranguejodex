<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capturado e consentimento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1E1E}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEF; font-family: Outfit, sans-serif; color: #1E1E1E; padding: 52px 24px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em">Capturado!</h1>
    <span style="padding: 4px 14px; border: 2px solid #1E1E1E; border-radius: 999px; background: #FBBC04; font-size: 14px; font-weight: 800">#002 · Ouro · +50 XP</span>
  </div>
  <div style="position: relative; height: 200px; display: flex; align-items: flex-end; justify-content: center">
    <svg style="position: absolute; left: 50%; top: 4px; margin-left: -150px" width="300" height="190" viewBox="0 0 300 190" fill="none" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M150 10v22M80 30l12 18M220 30l-12 18M30 80l20 8M270 80l-20 8M20 140h22M258 140h22"></path>
    </svg>
    <div style="position: absolute; bottom: 4px; width: 230px; height: 44px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 50%; background: #34A853"></div>
    <img src="assets/crabuntu.png" alt="Caranguejo do Patrocinador B, capturado" style="position: relative; width: 210px; height: auto; display: block; margin-bottom: 18px; filter: hue-rotate(130deg)">
  </div>
  <div style="text-align: center; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 20px; font-weight: 800">Caranguejo [Patrocinador B]</span>
    <span style="font-size: 14px; color: #3A3A3A">Desafio ao vivo no Estande 2 · 3 de 6 na Dex</span>
  </div>
  <div style="display: flex; flex-direction: column; border: 2px solid #1E1E1E; border-radius: 22px; background: #FFFFFF; box-shadow: 0 5px 0 #1E1E1E; overflow: hidden">
    <span style="padding: 12px 18px 4px; font-size: 15px; font-weight: 800">Compartilhar com o [Patrocinador B]?</span>
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 18px; border-top: 1.5px solid #E0E0E0; font-size: 16px">
        <input type="checkbox" checked="{{o.checked}}" onChange="{{o.toggle}}" style="width: 22px; height: 22px; accent-color: #1E1E1E">
        <span style="display: flex; flex-direction: column">
          <span style="font-weight: 700">{{o.label}}</span>
          <span style="font-size: 13px; color: #555555">{{o.hint}}</span>
        </span>
      </label>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Perfil.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; box-sizing: border-box; border: 2px solid #1E1E1E; border-radius: 18px; background: #34A853; box-shadow: 0 5px 0 #1E1E1E; font-size: 17px; font-weight: 800; letter-spacing: 0.05em; text-decoration: none">{{ctaLabel}}</a>
  <a href="Perfil.dc.html" style="align-self: center; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 700">Não compartilhar nada</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { linkedin: true } };
  }
  renderVals() {
    const picked = this.state.picked;
    const defs = [
      { id: 'linkedin', label: 'Perfil do LinkedIn', hint: 'linkedin.com/in/anasouza' },
      { id: 'email', label: 'E-mail', hint: 'Para novidades do patrocinador' },
      { id: 'vagas', label: 'Aceito contato sobre vagas', hint: 'O recrutamento pode te chamar' }
    ];
    const options = defs.map((d) => ({
      ...d,
      checked: !!picked[d.id],
      toggle: () => this.setState({ picked: { ...picked, [d.id]: !picked[d.id] } })
    }));
    const n = defs.filter((d) => picked[d.id]).length;
    return {
      options,
      ctaLabel: n === 0 ? 'GUARDAR NA DEX' : 'GUARDAR E COMPARTILHAR ' + n
    };
  }
}
</script>
</body>
</html>
